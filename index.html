<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Koast Time Clock</title>

  <meta name="theme-color" content="#0d0e20" />
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- iOS: Safari doesn't read the web manifest for "Add to Home Screen",
       so these are set explicitly for a proper full-screen/standalone feel -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Time Clock" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body style="margin:0; background:#0d0e20;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
